name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag (e.g. v0.1.0) — остави пустым для ручного ввода'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TailscaleSwitcher-win-x64
          path: |
            artifacts/TailscaleSwitcher-win-x64.zip
            artifacts/TailscaleSwitcher-win-x64.zip.sha256
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/TailscaleSwitcher-win-x64.zip
            artifacts/TailscaleSwitcher-win-x64.zip.sha256
          generate_release_notes: true
